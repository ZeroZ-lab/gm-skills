<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>Layered Architecture Template</title><style>body{margin:0;background:#f5f7fa;font:16px/1.55 system-ui}main{max-width:1120px;margin:auto;padding:20px 16px}p{margin:0 0 12px;color:#475569}</style></head>
<body><main><p>This template shows abstraction layers with nearby downward routes and one side return rail.</p><layered-architecture-template></layered-architecture-template></main>
<script>
class LayeredArchitectureTemplate extends HTMLElement { constructor(){ super(); this.attachShadow({mode:"open"}); } get tokens(){ return {canvas:{w:1120,h:900},section:{x:56,y:130,w:1008,h:640,radius:16,pad:18,innerBottomPad:52,noteGap:28},node:{w:212,h:94,radius:18,border:1.5,padX:20,padTop:18,padBottom:16,metaX:18,metaY:16,metaW:58,metaH:22,metaRadius:11,metaTextY:27,titleY:52,descY:74},font:{title:31,sectionLabel:13,nodeTitle:17,nodeDesc:12,edgeLabel:11,note:13,meta:11},line:{width:3,baseWidth:7,arrow:5,labelH:22,labelPadX:12},spacing:{rowGap:58,colGap:54,laneGap:18,labelRailGap:28,sectionToNoteGap:28},color:{paper:"#fff",ink:"#0f172a",muted:"#64748b",border:"#d8e0ea",faint:"#eef2f7",blue:"#2563eb",green:"#059669",orange:"#ea580c",red:"#dc2626",purple:"#7c3aed",gray:"#334155"}}; } get spec(){ return {title:"Layered Architecture Template",topology:"layered-architecture",note:"Audit: layer spacing, route vocabulary, and node consistency passed.",legend:[{tone:"blue",label:"entry layer"},{tone:"purple",label:"coordination layer"},{tone:"gray",label:"support layer"}],layers:[{id:"layer_a",title:"Layer A",y:180},{id:"layer_b",title:"Layer B",y:314},{id:"layer_c",title:"Layer C",y:448},{id:"layer_d",title:"Layer D",y:582}],cols:{0:150,1:454,2:758},nodes:[{id:"unit_a",title:"UNIT A",desc:"entry component",tone:"blue",layer:"layer_a",col:0,meta:"layer"},{id:"unit_b",title:"UNIT B",desc:"core component",tone:"purple",layer:"layer_b",col:1,meta:"core"},{id:"unit_c",title:"UNIT C",desc:"constraint component",tone:"gray",layer:"layer_b",col:2,meta:"guard"},{id:"unit_d",title:"UNIT D",desc:"service component",tone:"green",layer:"layer_c",col:0,meta:"service"},{id:"unit_e",title:"UNIT E",desc:"state component",tone:"orange",layer:"layer_c",col:1,meta:"service"},{id:"unit_f",title:"UNIT F",desc:"support component",tone:"gray",layer:"layer_c",col:2,meta:"service"},{id:"unit_g",title:"UNIT G",desc:"base component",tone:"gray",layer:"layer_d",col:1,meta:"base"}],edges:[{from:"unit_a",to:"unit_b",tone:"blue",route:"side-channel",label:"entry request"},{from:"unit_b",to:"unit_c",tone:"gray",route:"right-left",label:"read guard"},{from:"unit_b",to:"unit_d",tone:"green",route:"bottom-top",label:"use service"},{from:"unit_b",to:"unit_e",tone:"orange",route:"bottom-top",label:"write state"},{from:"unit_f",to:"unit_b",tone:"gray",route:"outer-right",label:"return context"},{from:"unit_e",to:"unit_g",tone:"gray",route:"bottom-top",label:"store record"}]}; } connectedCallback(){ this.render(); } render(){ const t=this.tokens,nodes=this.placeNodes(this.spec.nodes),byId=Object.fromEntries(nodes.map(n=>[n.id,n])),edges=this.placeLabels(this.spec.edges,byId),audit=this.audit(nodes,edges); this.shadowRoot.innerHTML=`<style>svg{width:100%;height:auto;display:block;background:#fff;border:1px solid ${t.color.border};border-radius:18px}text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.edge-bg,.edge{fill:none;stroke-linecap:round;stroke-linejoin:round}.edge{stroke-width:${t.line.width}}.audit{font-size:${t.font.note}px;fill:${audit.ok ? t.color.green : t.color.red}}</style><svg viewBox="0 0 ${t.canvas.w} ${t.canvas.h}">${this.defs()}<rect width="${t.canvas.w}" height="${t.canvas.h}" fill="${t.color.paper}"/><text x="56" y="54" fill="${t.color.ink}" font-size="${t.font.title}" font-weight="850">${this.spec.title}</text><text x="56" y="82" fill="${t.color.muted}" font-size="${t.font.note}">Topology: ${this.spec.topology}. Vertical order defines abstraction and nearby routes do most of the work.</text>${this.renderLayers()}${this.renderLegend()}<g>${edges.map(e=>this.renderEdge(e,byId,true)).join("")}</g><g>${edges.map(e=>this.renderEdge(e,byId,false)).join("")}</g><g>${edges.map(e=>this.renderLabel(e)).join("")}</g><g>${nodes.map(n=>this.renderNode(n)).join("")}</g><text class="audit" x="56" y="834">${audit.message}</text><text x="56" y="858" fill="${t.color.muted}" font-size="${t.font.note}">${this.spec.note}</text></svg>`; } placeNodes(nodes){ const t=this.tokens,layerY=Object.fromEntries(this.spec.layers.map(l=>[l.id,l.y])); return nodes.map(node=>({...node,x:this.spec.cols[node.col],y:layerY[node.layer],w:t.node.w,h:t.node.h})); } placeLabels(edges,byId){ return edges.map(edge=>{ const A=this.anchors(byId[edge.from]),B=this.anchors(byId[edge.to]); if(edge.route==="right-left") return {...edge,labelAt:{x:(A.right.x+B.left.x)/2,y:A.right.y-28}}; if(edge.route==="outer-right") return {...edge,labelAt:{x:988,y:B.right.y-16}}; return {...edge,labelAt:{x:A.bottom.x+54,y:(A.bottom.y+B.top.y)/2}}; }); } renderLayers(){ const t=this.tokens; return `<rect x="${t.section.x}" y="${t.section.y}" width="${t.section.w}" height="${t.section.h}" rx="${t.section.radius}" fill="#fff" stroke="${t.color.border}"/>${this.spec.layers.map(layer=>`<g><rect x="${t.section.x+12}" y="${layer.y-22}" width="${t.section.w-24}" height="118" rx="14" fill="transparent" stroke="${t.color.faint}"/><text x="${t.section.x+24}" y="${layer.y-6}" fill="${t.color.muted}" font-size="${t.font.sectionLabel}" font-weight="700">${layer.title}</text></g>`).join("")}`; } renderLegend(){ const t=this.tokens; return `<g transform="translate(836 50)"><rect width="236" height="68" rx="14" fill="#fff" stroke="${t.color.border}"/><text x="16" y="20" fill="${t.color.muted}" font-size="${t.font.sectionLabel}" font-weight="700">Legend</text>${this.spec.legend.map((item,index)=>`<circle cx="${18+index*72}" cy="44" r="7" fill="${this.tone(item.tone).main}"/><text x="${30+index*72}" y="48" fill="${t.color.muted}" font-size="${t.font.note}">${item.label}</text>`).join("")}</g>`; } renderNode(n){ const t=this.tokens,tone=this.tone(n.tone); return `<g transform="translate(${n.x} ${n.y})"><rect width="${n.w}" height="${n.h}" rx="${t.node.radius}" fill="${tone.bg}" stroke="${tone.stroke}" stroke-width="${t.node.border}"/><rect x="${t.node.metaX}" y="${t.node.metaY}" width="${t.node.metaW}" height="${t.node.metaH}" rx="${t.node.metaRadius}" fill="${tone.main}"/><text x="${t.node.metaX+t.node.metaW/2}" y="${t.node.metaTextY}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="${t.font.meta}" font-weight="850">${n.meta}</text><text x="${n.w/2}" y="${t.node.titleY}" text-anchor="middle" dominant-baseline="middle" fill="${t.color.ink}" font-size="${t.font.nodeTitle}" font-weight="850">${n.title}</text><text x="${n.w/2}" y="${t.node.descY}" text-anchor="middle" dominant-baseline="middle" fill="${t.color.muted}" font-size="${t.font.nodeDesc}">${n.desc}</text></g>`; } renderEdge(e,byId,base){ const t=this.tokens,tone=this.tone(e.tone),d=this.routePath(e,byId); return base ? `<path class="edge-bg" d="${d}" stroke="${tone.base}" stroke-width="${t.line.baseWidth}"/>` : `<path class="edge" d="${d}" stroke="${tone.main}" marker-end="url(#arrow-${e.tone})"/>`; } renderLabel(e){ const t=this.tokens,tone=this.tone(e.tone),p=e.labelAt,w=Math.max(72,e.label.length*12+t.line.labelPadX*2); return `<rect x="${p.x-w/2}" y="${p.y-t.line.labelH/2}" width="${w}" height="${t.line.labelH}" rx="11" fill="#fff" stroke="${t.color.border}"/><text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle" fill="${tone.main}" font-size="${t.font.edgeLabel}" font-weight="800">${e.label}</text>`; } routePath(e,byId){ const A=this.anchors(byId[e.from]),B=this.anchors(byId[e.to]); if(e.route==="right-left") return `M${A.right.x} ${A.right.y} L${B.left.x} ${B.left.y}`; if(e.route==="outer-right"){ const railX=1010; return `M${A.right.x} ${A.right.y} L${railX} ${A.right.y} L${railX} ${B.right.y} L${B.right.x} ${B.right.y}`; } return `M${A.bottom.x} ${A.bottom.y} L${A.bottom.x} ${B.top.y-18} L${B.top.x} ${B.top.y-18} L${B.top.x} ${B.top.y}`; } anchors(n){ return {top:{x:n.x+n.w/2,y:n.y},bottom:{x:n.x+n.w/2,y:n.y+n.h},left:{x:n.x,y:n.y+n.h/2},right:{x:n.x+n.w,y:n.y+n.h/2},center:{x:n.x+n.w/2,y:n.y+n.h/2}}; } audit(nodes,edges){ const verticalOk=edges.filter(e=>e.route==="bottom-top").every(e=>e.labelAt.y > 300),outerRailOk=edges.some(e=>e.route==="outer-right" && e.labelAt.x===988),sizeOk=nodes.every(n=>n.w===this.tokens.node.w && n.h===this.tokens.node.h),legendOk=this.spec.legend.length===3; return {ok:verticalOk && outerRailOk && sizeOk && legendOk,message:verticalOk && outerRailOk && sizeOk && legendOk ? "Audit: layer spacing, route vocabulary, and node consistency passed." : "Audit: layer spacing, route vocabulary, or node consistency failed."}; } defs(){ const c=this.tokens.color; return `<defs>${["blue","green","orange","red","purple","gray"].map(k=>`<marker id="arrow-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="${c[k]}"/></marker>`).join("")}</defs>`; } tone(k){ return {blue:{main:"#2563eb",bg:"#dbeafe",stroke:"#bfdbfe",base:"#dbeafe"},green:{main:"#059669",bg:"#dcfce7",stroke:"#bbf7d0",base:"#dcfce7"},orange:{main:"#ea580c",bg:"#ffedd5",stroke:"#fed7aa",base:"#ffedd5"},red:{main:"#dc2626",bg:"#fee2e2",stroke:"#fecaca",base:"#fee2e2"},purple:{main:"#7c3aed",bg:"#ede9fe",stroke:"#ddd6fe",base:"#ede9fe"},gray:{main:"#334155",bg:"#f1f5f9",stroke:"#cbd5e1",base:"#e2e8f0"}}[k]; }}
customElements.define("layered-architecture-template", LayeredArchitectureTemplate);
</script></body></html>
