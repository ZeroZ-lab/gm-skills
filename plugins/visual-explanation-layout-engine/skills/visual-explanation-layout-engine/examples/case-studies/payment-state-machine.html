<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Payment State Machine Example</title>
<style>
body{margin:0;background:#f5f7fa;font:16px/1.55 system-ui}
main{max-width:1120px;margin:auto;padding:20px 16px}
p{margin:0 0 12px;color:#475569}
</style>
</head>
<body>
<main>
<p>This is a method template. The layout pass derives coordinates from row and column placement; the semantic data remains separate.</p>
<payment-state-machine></payment-state-machine>
</main>

<script>
class PaymentStateMachine extends HTMLElement {
  constructor(){ super(); this.attachShadow({mode:"open"}); }

  get tokens(){
    return {
      canvas:{w:1120,h:790},
      section:{x:56,y:150,w:1008,h:500,radius:16,pad:18,innerBottomPad:52,noteGap:28},
      node:{w:198,h:116,radius:18,border:1.5,padX:22,padTop:22,padBottom:18,metaX:22,metaY:22,metaW:54,metaH:24,metaRadius:12,metaTextY:34,titleY:68,descY:94},
      font:{title:31,sectionLabel:13,nodeTitle:20,nodeDesc:14,edgeLabel:11,note:13,meta:12},
      line:{width:3,baseWidth:7,arrow:5,labelH:22,labelPadX:12},
      spacing:{rowGap:94,colGap:60,laneGap:18,labelRailGap:34,sectionToNoteGap:28},
      color:{paper:"#fff",ink:"#0f172a",muted:"#64748b",border:"#d8e0ea",faint:"#eef2f7",blue:"#2563eb",green:"#059669",orange:"#ea580c",red:"#dc2626",purple:"#7c3aed",gray:"#334155"}
    };
  }

  get spec(){
    return {
      title:"Payment State Machine",
      topology:"state-machine",
      note:"Audit: main row handles normal progress; exception row gets dedicated channels and label rails.",
      rows:{main:260,secondary:470},
      cols:{0:82,1:340,2:620,3:878},
      nodes:[
        {id:"created",title:"CREATED",desc:"订单已创建",tone:"gray",row:"main",col:0,meta:"状态"},
        {id:"pending",title:"PENDING",desc:"等待支付",tone:"blue",row:"main",col:1,meta:"状态"},
        {id:"paid",title:"PAID",desc:"支付成功",tone:"green",row:"main",col:2,meta:"状态"},
        {id:"fulfill",title:"FULFILL",desc:"履约完成",tone:"purple",row:"main",col:3,meta:"状态"},
        {id:"closed",title:"CLOSED",desc:"超时关闭",tone:"orange",row:"secondary",col:0,meta:"终态"},
        {id:"failed",title:"FAILED",desc:"支付失败",tone:"red",row:"secondary",col:1,meta:"异常"},
        {id:"refunded",title:"REFUNDED",desc:"退款完成",tone:"orange",row:"secondary",col:2,meta:"补偿"}
      ],
      edges:[
        {from:"created",to:"pending",label:"创建支付单",tone:"blue",route:"right-left"},
        {from:"pending",to:"paid",label:"回调确认",tone:"green",route:"right-left"},
        {from:"paid",to:"fulfill",label:"触发履约",tone:"purple",route:"right-left"},
        {from:"pending",to:"failed",label:"失败回调",tone:"red",route:"side-channel"},
        {from:"pending",to:"closed",label:"超时关闭",tone:"orange",route:"left-down"},
        {from:"paid",to:"refunded",label:"退款流程",tone:"orange",route:"side-channel"}
      ]
    };
  }

  connectedCallback(){ this.render(); }

  render(){
    const t=this.tokens;
    const nodes=this.placeNodes(this.spec.nodes);
    const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
    const edges=this.placeLabels(this.spec.edges, byId);
    const audit=this.audit(nodes, edges);
    this.shadowRoot.innerHTML = `
<style>
svg{width:100%;height:auto;display:block;background:#fff;border:1px solid ${t.color.border};border-radius:18px}
text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.edge-bg,.edge{fill:none;stroke-linecap:round;stroke-linejoin:round}
.edge{stroke-width:${t.line.width}}
.flow{stroke-dasharray:7 10;animation:flow 1.8s linear infinite}
.audit{font-size:${t.font.note}px;fill:${audit.ok ? t.color.green : t.color.red}}
@keyframes flow{to{stroke-dashoffset:-34}}
</style>
<svg viewBox="0 0 ${t.canvas.w} ${t.canvas.h}">
${this.defs()}
<rect width="${t.canvas.w}" height="${t.canvas.h}" fill="${t.color.paper}"/>
<text x="56" y="54" fill="${t.color.ink}" font-size="${t.font.title}" font-weight="850">${this.spec.title}</text>
<text x="56" y="82" fill="${t.color.muted}" font-size="${t.font.note}">Topology: ${this.spec.topology}. Route vocabulary: right-left, left-down, side-channel.</text>
${this.renderSection()}
<g>${edges.map(e=>this.renderEdge(e,byId,true)).join("")}</g>
<g>${edges.map(e=>this.renderEdge(e,byId,false)).join("")}</g>
<g>${edges.map(e=>this.renderLabel(e)).join("")}</g>
<g>${nodes.map(n=>this.renderNode(n)).join("")}</g>
<text class="audit" x="56" y="738">${audit.message}</text>
<text x="56" y="762" fill="${t.color.muted}" font-size="${t.font.note}">${this.spec.note}</text>
</svg>`;
  }

  placeNodes(nodes){
    const t=this.tokens;
    return nodes.map(node=>({
      ...node,
      x:this.spec.cols[node.col],
      y:this.spec.rows[node.row],
      w:t.node.w,
      h:t.node.h
    }));
  }

  placeLabels(edges, byId){
    return edges.map(edge=>{
      const A=this.anchors(byId[edge.from]);
      const B=this.anchors(byId[edge.to]);
      if(edge.route==="right-left"){
        return {...edge,labelAt:{x:(A.right.x+B.left.x)/2,y:A.right.y-35}};
      }
      if(edge.route==="left-down"){
        return {...edge,labelAt:{x:B.top.x-90,y:B.top.y-34}};
      }
      return {...edge,labelAt:{x:B.top.x,y:B.top.y-34}};
    });
  }

  renderSection(){
    const t=this.tokens;
    const splitY=this.spec.rows.secondary-40;
    return `<rect x="${t.section.x}" y="${t.section.y}" width="${t.section.w}" height="${t.section.h}" rx="${t.section.radius}" fill="#fff" stroke="${t.color.border}"/>
<path d="M${t.section.x} ${splitY} H${t.section.x+t.section.w}" stroke="${t.color.faint}"/>
<text x="${t.section.x+18}" y="${splitY-10}" fill="${t.color.muted}" font-size="${t.font.sectionLabel}" font-weight="700">main row</text>
<text x="${t.section.x+18}" y="${splitY+24}" fill="${t.color.muted}" font-size="${t.font.sectionLabel}" font-weight="700">secondary row</text>`;
  }

  renderNode(n){
    const t=this.tokens, tone=this.tone(n.tone);
    return `<g transform="translate(${n.x} ${n.y})">
<rect width="${n.w}" height="${n.h}" rx="${t.node.radius}" fill="${tone.bg}" stroke="${tone.stroke}" stroke-width="${t.node.border}"/>
<rect x="${t.node.metaX}" y="${t.node.metaY}" width="${t.node.metaW}" height="${t.node.metaH}" rx="${t.node.metaRadius}" fill="${tone.main}"/>
<text x="${t.node.metaX+t.node.metaW/2}" y="${t.node.metaTextY}" text-anchor="middle" dominant-baseline="middle" fill="#fff" font-size="${t.font.meta}" font-weight="850">${n.meta}</text>
<text x="${n.w/2}" y="${t.node.titleY}" text-anchor="middle" dominant-baseline="middle" fill="${t.color.ink}" font-size="${t.font.nodeTitle}" font-weight="850">${n.title}</text>
<text x="${n.w/2}" y="${t.node.descY}" text-anchor="middle" dominant-baseline="middle" fill="${t.color.muted}" font-size="${t.font.nodeDesc}">${n.desc}</text>
</g>`;
  }

  renderEdge(e, byId, base){
    const t=this.tokens, tone=this.tone(e.tone), d=this.routePath(e, byId);
    return base ? `<path class="edge-bg" d="${d}" stroke="${tone.base}" stroke-width="${t.line.baseWidth}"/>`
                : `<path class="edge flow" d="${d}" stroke="${tone.main}" marker-end="url(#arrow-${e.tone})"/>`;
  }

  renderLabel(e){
    const t=this.tokens, tone=this.tone(e.tone), p=e.labelAt, w=Math.max(72,e.label.length*12+t.line.labelPadX*2);
    return `<rect x="${p.x-w/2}" y="${p.y-t.line.labelH/2}" width="${w}" height="${t.line.labelH}" rx="11" fill="#fff" stroke="${t.color.border}"/>
<text x="${p.x}" y="${p.y}" text-anchor="middle" dominant-baseline="middle" fill="${tone.main}" font-size="${t.font.edgeLabel}" font-weight="800">${e.label}</text>`;
  }

  routePath(e, byId){
    const A=this.anchors(byId[e.from]), B=this.anchors(byId[e.to]);
    if(e.route==="right-left") return `M${A.right.x} ${A.right.y} L${B.left.x} ${B.left.y}`;
    if(e.route==="left-down") return `M${A.left.x} ${A.left.y} L${B.top.x} ${A.left.y} L${B.top.x} ${B.top.y}`;
    const railY=this.spec.rows.secondary-34;
    return `M${A.bottom.x} ${A.bottom.y} L${A.bottom.x} ${railY} L${B.top.x} ${railY} L${B.top.x} ${B.top.y}`;
  }

  anchors(n){
    return {
      top:{x:n.x+n.w/2,y:n.y},
      bottom:{x:n.x+n.w/2,y:n.y+n.h},
      left:{x:n.x,y:n.y+n.h/2},
      right:{x:n.x+n.w,y:n.y+n.h/2},
      center:{x:n.x+n.w/2,y:n.y+n.h/2}
    };
  }

  audit(nodes, edges){
    const sectionBottom=this.tokens.section.y+this.tokens.section.h;
    const bottomOk=nodes.every(n=>n.y+n.h+this.tokens.section.innerBottomPad<=sectionBottom || n.row!=="secondary");
    const labelsOk=edges.every(e=>e.labelAt && e.labelAt.y < this.spec.rows.secondary+this.tokens.node.h);
    return {ok:bottomOk && labelsOk,message:bottomOk && labelsOk ? "Audit: passed spacing and label-rail checks." : "Audit: failed spacing or label-rail checks."};
  }

  defs(){
    const c=this.tokens.color;
    return `<defs>${["blue","green","orange","red","purple","gray"].map(k=>`
<marker id="arrow-${k}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto">
<path d="M0 0 L10 5 L0 10 Z" fill="${c[k]}"/>
</marker>`).join("")}</defs>`;
  }

  tone(k){
    return {
      blue:{main:"#2563eb",bg:"#dbeafe",stroke:"#bfdbfe",base:"#dbeafe"},
      green:{main:"#059669",bg:"#dcfce7",stroke:"#bbf7d0",base:"#dcfce7"},
      orange:{main:"#ea580c",bg:"#ffedd5",stroke:"#fed7aa",base:"#ffedd5"},
      red:{main:"#dc2626",bg:"#fee2e2",stroke:"#fecaca",base:"#fee2e2"},
      purple:{main:"#7c3aed",bg:"#ede9fe",stroke:"#ddd6fe",base:"#ede9fe"},
      gray:{main:"#334155",bg:"#f1f5f9",stroke:"#cbd5e1",base:"#e2e8f0"}
    }[k];
  }
}
customElements.define("payment-state-machine", PaymentStateMachine);
</script>
</body>
</html>
